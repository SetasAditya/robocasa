ont-size="16" fill="#285b86" font-weight="700">Small bowl seated inside support</text><text x="590" y="896" font-family="Arial, sans-serif" font-size="12" fill="#617264" font-weight="400">Actual development reset photograph below</text></g><g><rect x="24" y="928" width="524" height="190" rx="14" fill="white" stroke="#d9e2d6" /><text x="40" y="953" font-family="Arial, sans-serif" font-size="12" fill="#285b86" font-weight="700">09  CONTACT-RICH MANIPULATION</text><text x="40" y="984" font-family="Arial, sans-serif" font-size="21" fill="#213930" font-weight="700">Guided tray insertion</text><rect x="40" y="1004" width="492" height="36" rx="6" fill="#eef2e9" /><text x="52" y="1028" font-family="Arial, sans-serif" font-size="16" fill="#213930" font-weight="400">Oven tray on dining table</text><path d="M 286 1045 v 12 m -6 -6 l 6 6 6 -6" fill="none" stroke="#285b86" stroke-width="2" /><text x="52" y="1082" font-family="Arial, sans-serif" font-size="16" fill="#285b86" font-weight="700">Tray seated between blue guides</text><text x="40" y="1106" font-family="Arial, sans-serif" font-size="12" fill="#617264" font-weight="400">Actual development reset photograph below</text></g><g><rect x="574" y="928" width="524" height="190" rx="14" fill="white" stroke="#d9e2d6" /><text x="590" y="953" font-family="Arial, sans-serif" font-size="12" fill="#285b86" font-weight="700">10  CONTACT-RICH MANIPULATION</text><text x="590" y="984" font-family="Arial, sans-serif" font-size="21" fill="#213930" font-weight="700">Sponge contact coverage</text><rect x="590" y="1004" width="492" height="36" rx="6" fill="#eef2e9" /><text x="602" y="1028" font-family="Arial, sans-serif" font-size="16" fill="#213930" font-weight="400">Sponge on dining table</text><path d="M 836 1045 v 12 m -6 -6 l 6 6 6 -6" fill="none" stroke="#285b86" stroke-width="2" /><text x="602" y="1082" font-family="Arial, sans-serif" font-size="16" fill="#285b86" font-weight="700">Wipe marked patch and release</text><text x="590" y="11