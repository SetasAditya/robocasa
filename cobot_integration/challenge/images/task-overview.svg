<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1160" role="img" aria-labelledby="title desc"><title id="title">LabApt: ten task profiles in two families</title><desc id="desc">Goal schematics for six constrained manipulation profiles and four contact-rich profiles. Arrows indicate intended outcomes, not executed trajectories.</desc><rect width="1120" height="1160" fill="#fafbf7" /><text x="24" y="38" font-family="Arial, sans-serif" font-size="28" fill="#213930" font-weight="700">LabApt: 10 task profiles, 2 families</text><text x="24" y="66" font-family="Arial, sans-serif" font-size="16" fill="#617264" font-weight="400">Goal schematics • fixed kitchen geometry • experimental task definitions</text><g><rect x="24" y="88" width="524" height="190" rx="14" fill="white" stroke="#d9e2d6" /><text x="40" y="113" font-family="Arial, sans-serif" font-size="12" fill="#244f40" font-weight="700">01  CONSTRAINED MANIPULATION</text><text x="40" y="144" font-family="Arial, sans-serif" font-size="21" fill="#213930" font-weight="700">Occluded mug retrieval</text><rect x="40" y="164" width="492" height="36" rx="6" fill="#eef2e9" /><text x="52" y="188" font-family="Arial, sans-serif" font-size="16" fill="#213930" font-weight="400">Mug behind other mugs</text><path d="M 286 205 v 12 m -6 -6 l 6 6 6 -6" fill="none" stroke="#244f40" stroke-width="2" /><text x="52" y="242" font-family="Arial, sans-serif" font-size="16" fill="#244f40" font-weight="700">Mug released on appliance counter</text><text x="40" y="266" font-family="Arial, sans-serif" font-size="12" fill="#617264" font-weight="400">Actual development reset photograph below</text></g><g><rect x="574" y="88" width="524" height="190" rx="14" fill="white" stroke="#d9e2d6" /><text x="590" y="113" font-family="Arial, sans-serif" font-size="12" fill="#244f40" font-weight="700">02  CONSTRAINED MANIPULATION</text><text x="590" y="144" font-family="Arial, sans-serif" font-size="21" fill="#213930" font-weight="700">Crowded rack mug 